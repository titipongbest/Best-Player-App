name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the signed APK"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BestPlayer-debug
          path: app/build/outputs/apk/debug/*.apk

      # Signed release build, only when the signing secrets are set.
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK + AAB
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease bundleRelease --stacktrace
      - name: Verify signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "Signer|SHA-256"
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: BestPlayer-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # Publish a GitHub Release (tag v<versionName>) on a v* tag push or a manual run with release=true.
      - name: Read version
        id: ver
        if: env.KEYSTORE_BASE64 != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.release)
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/*.apk "BestPlayer-v$V.apk"
          cp app/build/outputs/bundle/release/*.aab "BestPlayer-v$V.aab"
      - name: Publish GitHub Release
        if: steps.ver.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Best Player v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            BestPlayer-v${{ steps.ver.outputs.name }}.apk
            BestPlayer-v${{ steps.ver.outputs.name }}.aab
